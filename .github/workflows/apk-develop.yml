name: APK from develop

# Builds an installable APK from every push to develop and publishes it as the
# pre-release "develop-latest", so it can be downloaded on the phone.
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-develop
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Publish pre-release develop-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short HEAD)
          apk="todosian-develop-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release delete develop-latest --cleanup-tag --yes || true
          gh release create develop-latest "$apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Todosian develop (${short})" \
            --notes "Debug-APK aus develop, Stand ${short} ($(date -u +%Y-%m-%d)). Installiert sich als eigene App \"Todosian\" (com.isotjs.todosian.debug) neben einer Version aus F-Droid. Spätere APKs dieser Seite installieren sich als Update darüber."
